[package]
name = "fastpick"
version = "0.4.1"
edition = "2021"
rust-version = "1.88"
description = "Terminal picker for Claude Code, Codex and OpenCode: choose the harness, the provider and the model, then launch it with the environment that combination needs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/beboite/fastpick"
homepage = "https://crates.io/crates/fastpick"
keywords = ["claude-code", "codex", "opencode", "coding-agent", "launcher"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
crossterm = "0.28"
dirs = "5"
# Verifies the signature on a downloaded release before it replaces this binary. Pure
# Rust, no transitive dependencies, and it only ever verifies: no key material is handled.
minisign-verify = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
