[package]
name = "fastpick"
version = "0.2.1"
edition = "2021"
rust-version = "1.74"
description = "Terminal picker that chooses a coding harness, a provider and a model, then launches it with the right environment"
license = "MIT"
readme = "README.md"
repository = "https://github.com/klNuno/fastpick"
homepage = "https://github.com/klNuno/fastpick"
keywords = ["cli", "tui", "llm", "launcher", "picker"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github"]

[dependencies]
anyhow = "1"
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
