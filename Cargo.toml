[package]
name = "fastpick"
version = "0.2.1"
edition = "2021"
description = "Terminal picker that chooses a coding harness, a provider and a model, then launches it with the right environment"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
