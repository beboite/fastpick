version: 2

updates:
  # Grouped into one pull request per ecosystem. Ungrouped, a quiet week still opens five
  # of them, and the noise is what makes a security bump easy to miss.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
    commit-message:
      prefix: chore

  # The workflows pin every action to a commit SHA, which is the point: a tag can be moved
  # under you. Dependabot rewrites the SHA and the version comment together, so pinning
  # costs nothing to keep current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
