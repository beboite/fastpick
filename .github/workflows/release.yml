name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: fastpick-x86_64-pc-windows-msvc.exe
            binary: fastpick.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: fastpick-x86_64-unknown-linux-gnu
            binary: fastpick
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: fastpick-aarch64-unknown-linux-gnu
            binary: fastpick
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: fastpick-x86_64-apple-darwin
            binary: fastpick
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: fastpick-aarch64-apple-darwin
            binary: fastpick
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Prereleases and suffixed tags are refused rather than built: the updater compares
      # three numbers and would never offer them anyway, so a release nobody can reach is
      # worse than a failed workflow.
      - name: Check the tag shape
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH" && exit 1 ;;
          esac

      # A tag that disagrees with Cargo.toml ships a binary whose `--version` lies, and the
      # updater would then offer the same release again on every check.
      - name: Check the version matches the tag
        shell: bash
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::Cargo.toml says $crate, the tag says $tag"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, pinned 2026-06-09
        with:
          targets: ${{ matrix.target }}

      # The only target here that is not native to its runner and needs a linker of its own.
      - name: Install the aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name the binary after its target
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.target }}
          if-no-files-found: error
          path: dist/${{ matrix.asset }}

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The changelog below walks back to the previous tag.
          fetch-depth: 0

      # Checked before anything is built into a release, so a missing key fails the run
      # rather than publishing binaries the updater will then refuse to install.
      - name: Check the signing key secret
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::the repository secret MINISIGN_SECRET_KEY is empty. Every release asset has to be signed: fastpick --update refuses an unsigned one."
            exit 1
          fi

      - name: Download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      # Signed here rather than in each build job: one tool to install, one key to expose,
      # and the key never travels to a Windows or macOS runner.
      - name: Sign every asset
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          umask 077
          key="$(mktemp)"
          # tr because a key pasted from a Windows machine carries CRLF, and minisign reads
          # the base64 line whole: the \r would land inside it and fail as a bad key.
          printf '%s\n' "$MINISIGN_SECRET_KEY" | tr -d '\r' > "$key"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          cd dist
          for f in fastpick-*; do
            case "$f" in *.minisig) continue ;; esac
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$f" -x "$f.minisig"
          done
          ls -la

      - name: Generate SHA256 checksums
        run: |
          cd dist
          rm -f SHA256SUMS.txt
          files=$(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort)
          if [ -z "$files" ]; then
            echo "::error::no release artifacts found"
            exit 1
          fi
          printf '%s\n' "$files" | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Verified with the public key the binaries themselves carry, so a key rotated in the
      # secret without being rotated in the source is caught here instead of by every user's
      # `--update` at once.
      - name: Verify the signatures against the compiled-in key
        run: |
          pub=$(sed -n 's/^const PUBLIC_KEY: &str = "\(.*\)";$/\1/p' src/update.rs)
          if [ -z "$pub" ]; then
            echo "::warning::src/update.rs has no public key yet, so the signatures cannot be checked against it and --update will refuse this release. Fill PUBLIC_KEY in before publishing."
            exit 0
          fi
          printf 'untrusted comment: fastpick\n%s\n' "$pub" > minisign.pub
          cd dist
          for f in fastpick-*; do
            case "$f" in *.minisig) continue ;; esac
            minisign -V -p ../minisign.pub -m "$f"
          done

      - name: Write the release notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          previous=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          {
            if [ -n "$previous" ]; then
              echo "## Changes since ${previous}"
              echo
              git log --no-merges --format='- %s' "${previous}..${tag}"
            else
              echo "## Changes"
              echo
              git log --no-merges --format='- %s' "${tag}"
            fi
            cat <<'EOF'

          ## Install

          Download the file for your platform, make it executable and put it on your PATH.
          Every asset is signed; `SHA256SUMS.txt` covers the same files.

          An existing install updates itself with `fastpick --update`, which checks the
          signature before replacing anything.
          EOF
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # Draft on purpose. `releases/latest` skips drafts, so nothing is offered to anyone
      # until a human has looked at the assets and pressed publish.
      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
