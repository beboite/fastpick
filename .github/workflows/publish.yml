name: Publish

# crates.io follows the GitHub release rather than the tag. Pushing a tag only builds the
# binaries and opens a draft, so publishing here would put a version on crates.io that
# nobody can download a binary for yet, and `cargo install` would offer code the release
# notes have not been read for. Publishing the draft is the one human decision, and it is
# what triggers this.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  crates-io:
    name: crates.io
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing trades a short-lived OIDC token for a crates.io one at run time,
      # so no long-lived registry token has to sit in the repository secrets. Configured on
      # crates.io under the crate's Settings, Trusted Publishing, naming this repository and
      # this workflow file.
      id-token: write
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      # The tag names the release and Cargo.toml names the crate, and nothing forces them to
      # agree. Checked before anything is uploaded: crates.io versions are permanent, so a
      # wrong one cannot be taken back, only yanked.
      - name: Check the tag and the manifest agree
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${tag#v}" != "$manifest" ]; then
            echo "::error::tag ${tag} and Cargo.toml ${manifest} disagree, so it is not clear which version this release is"
            exit 1
          fi
          echo "version=${manifest}" >> "$GITHUB_OUTPUT"

      # Before the authentication step on purpose, so re-publishing an old release, or one
      # whose version was pushed by hand, ends as a green skip rather than a failed run.
      - name: Skip a version crates.io already has
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name=fastpick
          index="https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
          if curl -sf -H "User-Agent: ${name} release workflow" "$index" \
             | grep -q "\"vers\":\"${VERSION}\""; then
            echo "::notice::crates.io already serves ${name} ${VERSION}, nothing to upload"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to crates.io
        id: auth
        if: steps.check.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # --locked so the published crate builds against the lockfile in the repository,
        # which is what `cargo install --locked` will resolve for anyone installing it.
        run: cargo publish --locked
